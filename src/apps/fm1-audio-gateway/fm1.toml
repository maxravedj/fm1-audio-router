# Closed callback sets, audited for the SRAM runtime (all loaded executable
# sections are independently required to reside in SRAM by the ELF checker).
# SBC: fixed synthesis/bit-allocation tables; SSP: br_lmp_send; RF: RAM wait/
# burst helpers; BLE MIDI: own_out_* and stream callbacks (no stream registered);
# micro-ecc: P-192/P-256 arithmetic tables and br_rng.
# AAC: compiler switch jump tables (frame/hufffac), and huffspec's closed
# decode_huff_cw_tab1..11 and unpack_idx families. Every target is in SRAM.
# cpu2_job dispatches only AAC, SBC, aptX or resampler jobs linked into SRAM.
ram_code_allow = ["cpu2_job", "PVMP4AudioDecodeFrame", "huffspec_fxp", "hufffac","OI_SBC_SynthFrame", "DecodeBody", "OI_SBC_ComputeBitAllocation",
 "btp_en_start", "btp_put", "fm1_rfc_txlo_search", "fm1_ble_rf_exec",
 "ble_app_midi_pop", "ble_app_midi_peek", "ble_poll",
 "uECC_vli_modMult_fast", "EccPoint_mult", "uECC_generate_random_int"]
