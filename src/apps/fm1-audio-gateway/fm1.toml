# SPDX-License-Identifier: MPL-2.0
# USB audio gateway with read-only stereo waveform and meters. Playback depends on recording being enabled.
name = "FM1AUDIO"
id_prefix = "FM-1_731"
bootloader = "../../boot/m-bootloader/fm1-uboot.boot"
bootloader_sha256 = "cedc9c17648bdeecda5c8d0ffffe2211849f8a36ab615fe49d6cc46d249baf44"
usb_manufacturer = "FM-1 Audio Gateway"
usb_product = "FM1 Audio"
# FX units use mixed case; trim empty glyph margins to save SRAM.
font_full = ["T", "L"]
font_trim = true
usb_audio_in = true
usb_audio_out = true
usb_audio_in_channels = 2
usb_audio_in_24bit = false
usb_audio_out_24bit = false
# The PC follows the audio clock; playback reads frames without interpolation.
usb_audio_out_feedback = true
usb_audio_split = false
ble = true
ble_stack = "own"
ble_diag = false
ble_central = false
bt_audio = true
wifi = false
cpu2 = true
cpu2_fallback = false
cpu2_stack = 6144
main_stack = 8192
# A LATM element may contain up to 64 AAC frames; never use the render's 8-ms deadline.
cpu2_timeout_us = 2000000
# Keep audio/USB/LED interrupts running during settings erase/program.
ram_runtime = true
usb_host = false
usb_console = false
